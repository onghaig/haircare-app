name: Android APK

# Builds an installable .apk on a Linux runner and uploads it as a workflow artifact, so the app
# can be sideloaded on an Android phone. No Play Console account and no Mac needed. The release
# build is signed with the Android debug key (Expo's default), which any phone accepts with
# "Install unknown apps" allowed. See README > "Android: install the APK".
#
# Three jobs:
#   core  the pure-Kotlin scan core's JVM tests (same tests and reference fixtures as the Swift core)
#   apk   the phone APK (64-bit ARM), with the Kotlin scan camera and on-device models
#   e2e   an emulator build with the demo face, running the Maestro flows end to end, recorded
on:
  pull_request:
    paths:
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'modules/headmap/**'
      - 'src/**'
      - 'e2e/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Kotlin core tests
        working-directory: modules/headmap/kotlin-core
        # Maven Central rate-limits shared CI runners (HTTP 429). Retry only download failures.
        run: |
          for i in 1 2 3; do
            gradle test --no-daemon 2>&1 | tee test.log; status=${PIPESTATUS[0]}
            [ $status -eq 0 ] && exit 0
            grep -qE "status code 429|Could not GET|Could not resolve (all|plugin)" test.log || exit $status
            echo "Dependency download failed (attempt $i), retrying in $((i * 30))s"; sleep $((i * 30))
          done
          exit $status

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Download on-device models (fails the build if missing)
        run: npm run models
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK (64-bit ARM, which every current Android phone uses)
        working-directory: android
        run: |
          set +e
          # Maven Central rate-limits shared CI runners (HTTP 429). Retry only download failures.
          for i in 1 2 3; do
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon > build.log 2>&1
            status=$?
            [ $status -eq 0 ] && break
            grep -qE "status code 429|Could not GET|could not resolve plugin artifact|Could not resolve all" build.log || break
            echo "Dependency download failed (attempt $i), retrying in $((i * 30))s"; sleep $((i * 30))
          done
          echo "::group::Errors"
          grep -nE "^e: |error:|FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)" -A6 build.log | head -200
          echo "::endgroup::"
          tail -40 build.log
          exit $status
      - name: Check and name the APK
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          # A standalone build must carry its own JS bundle, or it opens to a red screen.
          unzip -l "$APK" | grep -q "assets/index.android.bundle" || { echo "JS bundle missing from the APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/face_landmarker.task" || { echo "scan models missing from the APK"; exit 1; }
          if unzip -l "$APK" | grep -q "demo_face"; then echo "the demo face must not ship to phones"; exit 1; fi
          cp "$APK" Haircare.apk
          ls -lh Haircare.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Haircare-apk
          path: android/Haircare.apk
          retention-days: 14
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: android/build.log

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # only for the ci-demo branch below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Download on-device models
        run: npm run models
      - name: Add the demo face (emulator builds only; it has no real camera)
        run: cp e2e/assets/demo_face.jpg modules/headmap/ios/models/demo_face.jpg
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      # MediaPipe's tasks-vision AAR ships ARM libraries only. An x86_64 APK installs without
      # libmediapipe_tasks_vision_jni.so, so every frame fails analysis and the scan records no
      # measurements. Build ARM64 instead: the API 34 x86_64 emulator image runs it through its
      # built-in ARM translation, so the E2E exercises the real on-device analysis.
      - name: Build the release APK (ARM64, run on the emulator through ARM translation)
        working-directory: android
        run: |
          set +e
          # Maven Central rate-limits shared CI runners (HTTP 429). Retry only download failures.
          for i in 1 2 3; do
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon > build.log 2>&1
            status=$?
            [ $status -eq 0 ] && break
            grep -qE "status code 429|Could not GET|could not resolve plugin artifact|Could not resolve all" build.log || break
            echo "Dependency download failed (attempt $i), retrying in $((i * 30))s"; sleep $((i * 30))
          done
          grep -nE "^e: |error:|FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)" -A6 build.log | head -200
          tail -20 build.log
          exit $status
      - name: List the APK's native libraries (MediaPipe must be among them)
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E 'lib/.*\.so$' | awk '{print $4}' | sort
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install ffmpeg (joins the screen recording parts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: End-to-end flows (Maestro) on the emulator, recorded as a demo video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./e2e/android/run.sh
      - name: Publish the demo video and screenshots to the ci-demo branch
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          out=$(mktemp -d)
          [ -f e2e-results/demo.mp4 ] && cp e2e-results/demo.mp4 "$out/demo.mp4"
          find e2e-results -name '*.png' -exec cp {} "$out/" \;
          [ -n "$(ls -A "$out")" ] || exit 0
          ls -lh "$out"
          [ ! -f "$out/demo.mp4" ] || [ "$(stat -c%s "$out/demo.mp4")" -lt 95000000 ] || rm "$out/demo.mp4"
          DEST="$BRANCH-android"
          git config --global user.name github-actions
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4; do
            rm -rf ../ci-demo
            git fetch -q origin ci-demo && git worktree add -q ../ci-demo FETCH_HEAD || { git worktree add -q --detach ../ci-demo && git -C ../ci-demo checkout -q --orphan tmp && git -C ../ci-demo rm -rfq . ; }
            rm -rf "../ci-demo/$DEST" && mkdir -p "../ci-demo/$DEST" && cp "$out"/* "../ci-demo/$DEST/"
            git -C ../ci-demo add -A
            git -C ../ci-demo commit -qm "Android E2E demo for $BRANCH at ${GITHUB_SHA::7}" || exit 0
            git -C ../ci-demo push -q origin HEAD:refs/heads/ci-demo && exit 0
            git worktree remove --force ../ci-demo
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results
          path: |
            e2e-results
            android/build.log
          retention-days: 14
