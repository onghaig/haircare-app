# End-to-end: the real Release app (JS bundle + Swift HeadMap module) on an iOS simulator,
# from a fresh install through every screen built so far. Each milestone adds its subflow here.
# Screenshots land in the e2e-results artifact.
appId: com.onghaig.haircare
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
# Android emulators sometimes show a system "isn't responding" dialog right after boot.
- tapOn:
    text: "Wait"
    optional: true
- runFlow: subflows/onboarding.yaml
- runFlow: subflows/scan.yaml
- runFlow: subflows/reveal.yaml
- runFlow: subflows/today.yaml
- runFlow: subflows/progress.yaml
- runFlow: subflows/predict.yaml
- runFlow: subflows/panorama.yaml
- runFlow: subflows/manage-scan.yaml
