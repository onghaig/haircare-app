# End-to-end: the real Release app (JS bundle + Swift HeadMap module) on an iOS simulator.
# The simulator has no camera, so this proves the flow and the native module run without
# crashing and that a camera failure is shown, not swallowed. The photo itself needs a phone.
appId: com.onghaig.haircare
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
- takeScreenshot: e2e-1-today
- tapOn: "Scan"
- assertVisible: "Start your first scan"
- tapOn: "Start your first scan"
- assertVisible: "Before you scan"
- takeScreenshot: e2e-2-checklist
- tapOn: "Start scan"
- assertVisible: "Front: hairline"
- assertVisible: "View 1 of 5"
# No simulator camera: the native module reports it and the HUD shows it.
- extendedWaitUntil:
    visible: "Camera problem"
    timeout: 10000
- takeScreenshot: e2e-3-camera-hud
# The shutter path that crashed on device must not take the app down.
- tapOn: "Take photo now"
- assertVisible: "Front: hairline"
- tapOn: "Close scan"
- assertVisible: "Start your first scan"
- takeScreenshot: e2e-4-back-on-scan-tab
