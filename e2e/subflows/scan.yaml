# The full guided scan. The simulator has no camera, so CI builds include an illustrated demo
# face that runs through the real on-device analysis; the green hairline highlight animates on
# every view. Shots are taken by hand with the manual shutter, which appears once a view has been
# stuck for a few seconds ("Having trouble? Take it anyway"); the crown uses the solo burst.
# Timeouts are generous: the Android E2E app runs through ARM translation, where each photo is
# analysed several times slower than on a phone.
appId: com.onghaig.haircare
---
- assertVisible: "Before you scan"
- takeScreenshot: e2e-10-scan-checklist
# First scan: skip the practice view.
- tapOn: "Skip to the scan"
- assertVisible: "Front: hairline"
- assertVisible: "View 1 of 5"
# Let the hairline highlight draw (and the demo face be analysed) for the recording.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: e2e-11-front
# The on-device analysis must be running (it once failed to load on the emulator, unnoticed).
- assertNotVisible: "(The scan couldn’t start|No camera found|The camera is busy)"
# Each shot waits for the green line to finish drawing, then holds "Got it" before the next view.
# One tap per view: a retried tap would queue a shot for the next view too.
# The shutter shows only while a check fails; when every check passes the view captures itself.
- extendedWaitUntil:
    visible: "(Having trouble\\? Take it anyway|View 2 of 5)"
    timeout: 30000
- runFlow:
    when:
      visible: "Having trouble\\? Take it anyway"
    commands:
      - tapOn:
          text: "Having trouble\\? Take it anyway"
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 2 of 5"
    timeout: 30000
- assertVisible: "Left temple"
# Wait for the first analysis of the new view: its prompt can change the layout under the tap.
- extendedWaitUntil:
    notVisible: "Line up with the outline"
    timeout: 30000
# Redo the photo just taken: back to the front view, then on again.
- tapOn:
    id: "redo-last-photo"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 1 of 5"
    timeout: 30000
- takeScreenshot: e2e-12a-redo-last-photo
# The shutter shows only while a check fails; when every check passes the view captures itself.
- extendedWaitUntil:
    visible: "(Having trouble\\? Take it anyway|View 2 of 5)"
    timeout: 30000
- runFlow:
    when:
      visible: "Having trouble\\? Take it anyway"
    commands:
      - tapOn:
          text: "Having trouble\\? Take it anyway"
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 2 of 5"
    timeout: 30000
- takeScreenshot: e2e-12-left-temple
# The shutter shows only while a check fails; when every check passes the view captures itself.
- extendedWaitUntil:
    visible: "(Having trouble\\? Take it anyway|View 3 of 5)"
    timeout: 30000
- runFlow:
    when:
      visible: "Having trouble\\? Take it anyway"
    commands:
      - tapOn:
          text: "Having trouble\\? Take it anyway"
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 3 of 5"
    timeout: 30000
- assertVisible: "Right temple"
# The shutter shows only while a check fails; when every check passes the view captures itself.
- extendedWaitUntil:
    visible: "(Having trouble\\? Take it anyway|View 4 of 5)"
    timeout: 30000
- runFlow:
    when:
      visible: "Having trouble\\? Take it anyway"
    commands:
      - tapOn:
          text: "Having trouble\\? Take it anyway"
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 4 of 5"
    timeout: 30000
- assertVisible: "Top of head"
- takeScreenshot: e2e-13-top-down
# The shutter shows only while a check fails; when every check passes the view captures itself.
- extendedWaitUntil:
    visible: "(Having trouble\\? Take it anyway|View 5 of 5)"
    timeout: 30000
- runFlow:
    when:
      visible: "Having trouble\\? Take it anyway"
    commands:
      - tapOn:
          text: "Having trouble\\? Take it anyway"
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 5 of 5"
    timeout: 30000
- assertVisible: "Crown"
- takeScreenshot: e2e-14-crown
# The crown: on your own. A spoken countdown, spoken aiming hints, then a burst that keeps the
# best frame. The demo face is not a crown, so aiming times out and the burst runs anyway.
# On the slow Android emulator the top view can auto-capture just before the "Take photo now"
# tap lands, so that tap hits "Someone's helping me" on the crown screen. Switch back if so.
# Either button picks the solo way.
- extendedWaitUntil:
    visible: ".*n my own"
    timeout: 10000
- runFlow:
    when:
      visible: "I.m on my own"
    commands:
      - tapOn:
          text: "I.m on my own"
          retryTapIfNoChange: false
- runFlow:
    when:
      visible: "On my own"
    commands:
      - tapOn:
          text: "On my own"
          retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: "crown-countdown"
    timeout: 15000
- takeScreenshot: e2e-14a-crown-aiming
- extendedWaitUntil:
    visible: "Check your crown photo"
    timeout: 30000
- takeScreenshot: e2e-14b-crown-review
- tapOn:
    text: "Keep this photo"
    retryTapIfNoChange: false
# The finish moment, then the forecast. Hand-taken demo shots can score too low to count; then
# the result lists the weak views first, and we keep the scan and go on to the forecast. The
# "Building your forecast" screen is brief: a slow run can be past it before it is checked, so
# wait for either the weak-views result or the reveal itself (reveal.yaml checks the rest).
# "Scan complete" itself shows for about 2.4 s; a slow iOS runner can miss it, so accept the
# screen after it too.
- extendedWaitUntil:
    visible: "(Scan complete|Your Norwood timeline|Keep it and see my forecast)"
    timeout: 30000
- takeScreenshot: e2e-15-scan-finish
- extendedWaitUntil:
    visible: "(Your Norwood timeline|Keep it and see my forecast)"
    timeout: 60000
- runFlow:
    when:
      visible: "Keep it and see my forecast"
    commands:
      - takeScreenshot: e2e-16-weak-views
      - tapOn: "Keep it and see my forecast"
- extendedWaitUntil:
    notVisible: "Saving your scan"
    timeout: 30000
