# The guided scan from its checklist. The simulator has no camera, so this proves the flow and
# the native module run without crashing and that a camera failure is shown, not swallowed.
# Photo capture itself is only checked on a real phone.
appId: com.onghaig.haircare
---
- assertVisible: "Before you scan"
- takeScreenshot: e2e-10-scan-checklist
- tapOn: "Start scan"
- assertVisible: "Front: hairline"
- assertVisible: "View 1 of 5"
- extendedWaitUntil:
    visible: "Camera problem"
    timeout: 10000
- takeScreenshot: e2e-11-camera-hud
# The shutter path that crashed on device must not take the app down.
- tapOn: "Take photo now"
- assertVisible: "Front: hairline"
- tapOn: "Close scan"
- assertVisible: "Start your first scan"
- takeScreenshot: e2e-12-scan-tab
