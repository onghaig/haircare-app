# The full guided scan. The simulator has no camera, so CI builds include an illustrated demo
# face that runs through the real on-device analysis; the green hairline highlight animates on
# every view. Shots are taken by hand ("Take photo now", the crown self-timer).
appId: com.onghaig.haircare
---
- assertVisible: "Before you scan"
- takeScreenshot: e2e-10-scan-checklist
- tapOn: "Start scan"
- assertVisible: "Front: hairline"
- assertVisible: "View 1 of 5"
# Let the hairline highlight draw (and the demo face be analysed) for the recording.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: e2e-11-front
# The on-device analysis must be running (it once failed to load on the emulator, unnoticed).
- assertNotVisible: "Camera problem"
# Each shot waits for the green line to finish drawing, then holds "Got it" before the next view.
# One tap per view: a retried tap would queue a shot for the next view too.
- tapOn:
    text: "Take photo now"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 2 of 5"
    timeout: 10000
- assertVisible: "Left temple"
# Redo the photo just taken: back to the front view, then on again.
- tapOn:
    id: "redo-last-photo"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 1 of 5"
    timeout: 10000
- takeScreenshot: e2e-12a-redo-last-photo
- tapOn:
    text: "Take photo now"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 2 of 5"
    timeout: 10000
- takeScreenshot: e2e-12-left-temple
- tapOn:
    text: "Take photo now"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 3 of 5"
    timeout: 10000
- assertVisible: "Right temple"
- tapOn:
    text: "Take photo now"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 4 of 5"
    timeout: 10000
- assertVisible: "Top of head"
- takeScreenshot: e2e-13-top-down
- tapOn:
    text: "Take photo now"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 5 of 5"
    timeout: 10000
- assertVisible: "Crown"
- takeScreenshot: e2e-14-crown
# The timer is 3 seconds and Maestro's settle wait on the animated screen can take longer, so
# don't assert the countdown itself (it may already be over). One tap only: a retry would
# cancel the timer. The forecast screen appearing proves the timer took the crown photo.
- tapOn:
    text: "Take crown photo in 3 seconds"
    retryTapIfNoChange: false
# The first finished scan leads into the forecast.
- extendedWaitUntil:
    visible: "Building your forecast"
    timeout: 30000
