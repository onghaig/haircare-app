# The full guided scan. The simulator has no camera, so CI builds include an illustrated demo
# face that runs through the real on-device analysis; the green hairline highlight animates on
# every view. Shots are taken by hand ("Take photo now"); the crown uses the solo burst.
# Timeouts are generous: the Android E2E app runs through ARM translation, where each photo is
# analysed several times slower than on a phone.
appId: com.onghaig.haircare
---
- assertVisible: "Before you scan"
- takeScreenshot: e2e-10-scan-checklist
- tapOn: "Start scan"
- assertVisible: "Front: hairline"
- assertVisible: "View 1 of 5"
# Let the hairline highlight draw (and the demo face be analysed) for the recording.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: e2e-11-front
# The on-device analysis must be running (it once failed to load on the emulator, unnoticed).
- assertNotVisible: "Camera problem"
# Each shot waits for the green line to finish drawing, then holds "Got it" before the next view.
# One tap per view: a retried tap would queue a shot for the next view too.
- tapOn:
    text: "Take photo now"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 2 of 5"
    timeout: 30000
- assertVisible: "Left temple"
# Wait for the first analysis of the new view: its prompt can change the layout under the tap.
- extendedWaitUntil:
    notVisible: "Line up with the outline"
    timeout: 30000
# Redo the photo just taken: back to the front view, then on again.
- tapOn:
    id: "redo-last-photo"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 1 of 5"
    timeout: 30000
- takeScreenshot: e2e-12a-redo-last-photo
- tapOn:
    text: "Take photo now"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 2 of 5"
    timeout: 30000
- takeScreenshot: e2e-12-left-temple
- tapOn:
    text: "Take photo now"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 3 of 5"
    timeout: 30000
- assertVisible: "Right temple"
- tapOn:
    text: "Take photo now"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 4 of 5"
    timeout: 30000
- assertVisible: "Top of head"
- takeScreenshot: e2e-13-top-down
- tapOn:
    text: "Take photo now"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "View 5 of 5"
    timeout: 30000
- assertVisible: "Crown"
- takeScreenshot: e2e-14-crown
# The crown: on your own. A spoken countdown, spoken aiming hints, then a burst that keeps the
# best frame. The demo face is not a crown, so aiming times out and the burst runs anyway.
- tapOn:
    text: "On my own"
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: "crown-countdown"
    timeout: 15000
- takeScreenshot: e2e-14a-crown-aiming
- extendedWaitUntil:
    visible: "Check your crown photo"
    timeout: 30000
- takeScreenshot: e2e-14b-crown-review
- tapOn:
    text: "Keep this photo"
    retryTapIfNoChange: false
# The first finished scan saves, then leads into the forecast (reveal.yaml checks it). The
# "Building your forecast" screen is brief: a slow run can be past it before it is checked.
- extendedWaitUntil:
    notVisible: "Saving your scan"
    timeout: 30000
