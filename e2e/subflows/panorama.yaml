# The hair panorama: the scan's photos around the head, opened from the Scan tab.
appId: com.onghaig.haircare
---
- tapOn: "Scan"
- scrollUntilVisible:
    element: "See your hair from every angle"
- tapOn: "See your hair from every angle"
- assertVisible: "Your hair, all the way round"
- takeScreenshot: e2e-70-panorama-front
- swipe:
    from:
      id: "panorama-viewer"
    direction: LEFT
- takeScreenshot: e2e-71-panorama-turned
# Tap thumbs by id: a label tap can land on the neighbouring thumb.
- tapOn:
    id: "panorama-thumb-crown"
- assertVisible:
    id: "panorama-angle"
    text: "Back"
- tapOn:
    id: "panorama-thumb-top"
- takeScreenshot: e2e-72-panorama-top
- tapOn: "Close"
